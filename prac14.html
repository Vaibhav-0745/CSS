<!DOCTYPE html>
<html ng-app="myApp">
    <head>
        <title>Practical 13</title>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    </head>

    <body ng-controller="myCtrl">
        <form name="myForm">
            <label>Name:</label>
            <input type="text" name="name" ng-model="stud.name" required><br>
            <label>Phone no:</label>
            <input type="text" name="phone" ng-model="stud.phone" required><br>
            <input type="radio" value="Male" ng-model="stud.gender">Male
            <input type="radio" value="Female" ng-model="stud.gender">Female
            <button type="submit" ng-click="submitForm()">Submit</button>
        </form>
        <p style="color:red; font-weight:bold;" >{{message}}</p>
        <div ng-show="submitted">
            <h2 style="color: green;">Form Submitted Successfully!</h2>
            <p>Name: {{stud.name}}</p>
            <p>Phone: {{stud.phone}}</p>
            <p>Gender: {{stud.gender}}</p>
        </div>
        <script>
            var app = angular.module("myApp", []);
            app.controller("myCtrl",function($scope){
                $scope.stud = {};
                $scope.submitted = false;
                $scope.message = "";
                $scope.submitForm = function() {
                   if(!$scope.stud.name){
                    $scope.message = "Name is required";
                    $scope.submitted = false;
                   }
                   else if(!$scope.stud.phone){
                    $scope.message = "Phone number is required";
                    $scope.submitted = false;
                   }
                   else if(!$scope.stud.gender){
                    $scope.message ="Gender required"
                    $scope.submitted = false;
                   }
                   else{
                    $scope.message = "";
                    $scope.submitted = true;
                   }
                };
            })
        </script>
    </body>
</html>
