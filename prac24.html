<!DOCTYPE html>
<html ng-app="myApp">
    <head>
        <title>Practical 21</title>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
        
        <style>
            .odd-row { background-color: #f9f9f9; } /* Light Gray */
            .even-row { background-color: #e0f7fa; } /* Light Blue */
        </style>
    </head>
    <body ng-controller="myCtrl">
        
        <h3>Students Data:</h3>
        
        <table border="1" cellpadding="10" cellspacing="0">
            <tr>
                <th>S.No.</th>
                <th>Name</th>
                <th>Roll No.</th>
                <th>Marks</th>
            </tr>
            
            <tr ng-repeat="student in students" ng-class-odd="'odd-row'" ng-class-even="'even-row'">
                <td>{{$index + 1}}</td>
                <td>{{student.name}}</td>
                <td>{{student.roll}}</td>
                <td>{{student.marks}}</td>
            </tr>
        </table>

        <script>
            var app = angular.module("myApp",[]);
            app.controller("myCtrl",function($scope){
                
                // 3. Expanded the array to 10 students
                $scope.students = [
                    {name : "Vaibhav Satish Mendake", roll : 1, marks : 90},
                    {name : "John Doe", roll : 2, marks : 85},
                    {name : "Jane Smith", roll : 3, marks : 92},
                    {name : "Alice Johnson", roll : 4, marks : 88},
                    {name : "Bob Brown", roll : 5, marks : 80},
                    {name : "Charlie Davis", roll : 6, marks : 75},
                    {name : "Diana Prince", roll : 7, marks : 95},
                    {name : "Evan Wright", roll : 8, marks : 82},
                    {name : "Fiona Gallagher", roll : 9, marks : 89},
                    {name : "George Miller", roll : 10, marks : 91}
                ];
            });
        </script>
    </body>
</html>
